version: '3.8'

services:
  # Relational Database (PostgreSQL 16)
  postgres:
    image: postgres:16-alpine
    container_name: phcnet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: phcnet_db
      POSTGRES_USER: phcnet
      POSTGRES_PASSWORD: phcnet_secret_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phcnet -d phcnet_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - phcnet-network

  # Cache & Messaging Backbone (Redis 7)
  redis:
    image: redis:7-alpine
    container_name: phcnet-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - phcnet-network

  # Core Spring Boot 3 Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phcnet-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/phcnet_db
      SPRING_DATASOURCE_USERNAME: phcnet
      SPRING_DATASOURCE_PASSWORD: phcnet_secret_2026
      PHCNET_REDIS_HOST: redis
      PHCNET_REDIS_PORT: 6379
      PHCNET_SECURITY_JWT_SECRET: PHCNETAISecureJWTSecretKeyMustBeAtLeast256BitsLongForHMACSHA256AlgorithmCompliance
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - phcnet-network

  # Python Machine Learning & Gemini Agent Service
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: phcnet-ml-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      BACKEND_URL: http://backend:8080
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ENVIRONMENT: production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - phcnet-network

  # React 19 Frontend Dashboard & Nginx Reverse Proxy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: phcnet-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
      - ml-service
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - phcnet-network

networks:
  phcnet-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
