steps:
  # 1. Package backend JAR
  - name: 'eclipse-temurin:21-jdk-alpine'
    entrypoint: '/bin/sh'
    args:
      - '-c'
      - 'cd backend && ./mvnw clean package -DskipTests'

  # 2. Build Container Images
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/phcnet-repo/phcnet-backend:$SHORT_SHA', './backend']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/phcnet-repo/phcnet-ml-service:$SHORT_SHA', './ml-service']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/phcnet-repo/phcnet-frontend:$SHORT_SHA', './frontend']

  # 3. Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-south1-docker.pkg.dev/$PROJECT_ID/phcnet-repo/phcnet-backend:$SHORT_SHA']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-south1-docker.pkg.dev/$PROJECT_ID/phcnet-repo/phcnet-ml-service:$SHORT_SHA']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-south1-docker.pkg.dev/$PROJECT_ID/phcnet-repo/phcnet-frontend:$SHORT_SHA']

  # 4. Deploy Backend
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'phcnet-backend'
      - '--image=asia-south1-docker.pkg.dev/$PROJECT_ID/phcnet-repo/phcnet-backend:$SHORT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'

  # 5. Deploy ML Microservice
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'phcnet-ml-service'
      - '--image=asia-south1-docker.pkg.dev/$PROJECT_ID/phcnet-repo/phcnet-ml-service:$SHORT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'

  # 6. Deploy Frontend SPA
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'phcnet-frontend'
      - '--image=asia-south1-docker.pkg.dev/$PROJECT_ID/phcnet-repo/phcnet-frontend:$SHORT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/phcnet-repo/phcnet-backend:$SHORT_SHA'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/phcnet-repo/phcnet-ml-service:$SHORT_SHA'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/phcnet-repo/phcnet-frontend:$SHORT_SHA'
