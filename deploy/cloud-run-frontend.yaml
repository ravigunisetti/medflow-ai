apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: phcnet-frontend
  labels:
    cloud.googleapis.com/location: asia-south1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      containerConcurrency: 100
      containers:
        - image: asia-south1-docker.pkg.dev/${PROJECT_ID}/phcnet-repo/phcnet-frontend:latest
          ports:
            - containerPort: 80
          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 20
